<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>은하전쟁영웅전 1화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:Pretendard,"Malgun Gothic",sans-serif;color:#111}
.wrap{width:384px;max-width:calc(100% - 32px);margin:0 auto;padding:80px 0 160px}
.notice{text-align:center;color:#666;font-size:12px;line-height:18px;margin-bottom:28px}
.notice b{display:block;color:#444;font-weight:600}
.ep{text-align:center;font-size:20px;font-weight:700;margin:40px 0 0}
.fig{margin:160px 0 64px;position:relative}
.fig img{width:100%;display:block}
.cutno{position:absolute;top:-22px;left:0;font-size:11px;color:#aaa;letter-spacing:.02em}
p{font-size:20px;line-height:34px;margin:0 0 20px;word-break:keep-all}
p.gap{margin-top:48px}
.end{text-align:center;color:#999;font-size:14px;margin-top:120px}
</style>
</head>
<body>
<div class="wrap">
  <div class="notice"><b>연습본 (Human-in-the-Loop)</b>은하전쟁영웅전 1화 컷16~21 “별을 보고 계십니까”<br>그림은 AI 생성 후 사용자 검수 중입니다.</div>
  <div class="ep">1화</div>
  <div id="story">불러오는 중...</div>
  <div class="end">- 연습 범위 끝 -</div>
</div>
<script>
fetch(encodeURIComponent('웹소설대본_컷16-21.txt')+'?v='+Date.now()).then(r=>r.text()).then(t=>{
  const lines=t.replace(/\r/g,'').split('\n');
  const story=document.getElementById('story');story.textContent='';
  let started=false, blank=0;
  for(const l of lines){
    if(l.startsWith('[그림:')){
      started=true;
      const num=(l.match(/컷\s*(\d+)/)||[])[1];
      const fig=document.createElement('div');fig.className='fig';
      fig.innerHTML='<span class="cutno">1화 '+num+'컷</span><img alt="1화 '+num+'컷" src="'+encodeURIComponent('01화_컷'+num+'.png')+'?v='+Date.now()+'">';
      story.appendChild(fig);blank=0;continue;
    }
    if(!started) continue;
    if(/^-{5,}/.test(l)) break;
    if(!l.trim()){blank++;continue;}
    const p=document.createElement('p');p.textContent=l.trim();
    if(blank>0 && story.lastElementChild && story.lastElementChild.tagName==='P') p.className='gap';
    story.appendChild(p);blank=0;
  }
}).catch(e=>{document.getElementById('story').textContent='대본을 불러오지 못했습니다: '+e;});
</script>
</body>
</html>
