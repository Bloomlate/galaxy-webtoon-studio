<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>은하영웅전설 웹툰 작업실</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12141a;color:#e8e8ee;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.8}
header{padding:28px 20px 12px;max-width:1000px;margin:0 auto}
h1{margin:0 0 6px;font-size:22px}
.sub{color:#9aa0b4;font-size:14px}
.note{max-width:1000px;margin:12px auto;padding:12px 16px;background:#1d212b;border-left:3px solid #c9a24b;color:#b9bdcc;font-size:13px;white-space:pre-wrap}
main{max-width:1000px;margin:0 auto;padding:8px 20px 80px}
.cut{display:grid;grid-template-columns:360px 1fr;gap:24px;padding:24px 0;border-top:1px solid #2a2f3b}
.cut img{width:100%;border-radius:6px;display:block;background:#222}
.tag{display:inline-block;background:#c9a24b;color:#12141a;font-weight:700;font-size:13px;padding:2px 10px;border-radius:12px;margin-bottom:8px}
.desc{color:#8f95aa;font-size:13px;margin-bottom:12px}
.txt p{margin:0 0 14px;font-size:16px}
footer{max-width:1000px;margin:0 auto;padding:0 20px 40px;color:#6f7589;font-size:12px}
@media(max-width:720px){.cut{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>은하영웅전설 웹툰 작업실</h1>
<div class="sub">1단계 연습 | 웹툰 1화 컷16~21 "별을 보고 계십니까" | 수정 후 F5로 새로 고침</div>
</header>
<div class="note" id="note"></div>
<main id="list">불러오는 중...</main>
<footer id="foot"></footer>
<script>
const SCRIPT_URL=''+encodeURIComponent('웹소설대본_컷16-21.txt');
fetch(SCRIPT_URL+'?v='+Date.now()).then(r=>r.text()).then(t=>{
  const lines=t.replace(/\r/g,'').split('\n');
  const first=lines.findIndex(l=>l.startsWith('[그림:'));
  document.getElementById('note').textContent=lines.slice(0,first).join('\n').trim();
  const list=document.getElementById('list');list.textContent='';
  let cur=null;
  for(let i=first;i<lines.length;i++){
    const l=lines[i];
    if(/^-{5,}/.test(l)){cur=null;document.getElementById('foot').textContent=lines.slice(i+1).join(' ').trim();break;}
    if(l.startsWith('[그림:')){
      const m=l.match(/컷\s*(\d+)/);const num=m?m[1]:'';
      const desc=l.replace(/^\[그림:\s*컷\d+\s*-?\s*/,'').replace(/\]$/,'');
      const sec=document.createElement('section');sec.className='cut';
      sec.innerHTML='<div><img alt="컷'+num+'" src="'+encodeURIComponent('01화_컷'+num+'.png')+'?v='+Date.now()+'"></div><div class="txt"><span class="tag">1화 '+num+'컷</span><div class="desc"></div><div class="body"></div></div>';
      sec.querySelector('.desc').textContent=desc;
      list.appendChild(sec);cur=sec.querySelector('.body');continue;
    }
    if(cur&&l.trim()){const p=document.createElement('p');p.textContent=l.trim();cur.appendChild(p);}
  }
}).catch(e=>{document.getElementById('list').textContent='대본을 불러오지 못했습니다: '+e;});
</script>
</body>
</html>
